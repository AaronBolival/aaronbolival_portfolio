<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AJEB Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      body {
        background: #f3f5fa;
      }
      .side {
        width: 260px;
        position: fixed;
        inset: 0 auto 0 0;
        background: #111a2c;
        color: #fff;
        padding: 20px;
        overflow: auto;
      }
      .main {
        margin-left: 260px;
        padding: 25px;
      }
      .navbtn {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: #cbd4e7;
        text-align: left;
        padding: 9px;
        border-radius: 7px;
      }
      .navbtn:hover,
      .navbtn.active {
        background: #7058ff;
        color: white;
      }
      .admin-panel {
        background: white;
        border: 1px solid #dfe4ee;
        border-radius: 14px;
        padding: 20px;
        color: #172033;
      }
      @media (max-width: 800px) {
        .side {
          position: static;
          width: auto;
        }
        .main {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <aside class="side">
      <h4>AJEB Admin</h4>
      <p class="text-secondary small">User-friendly content manager</p>
      <div id="menu"></div>
      <hr />
      <a class="btn btn-outline-light btn-sm" href="../index.html"
        >View Portfolio</a
      >
      <button id="logout" class="btn btn-danger btn-sm">Logout</button>
    </aside>
    <main class="main">
      <section class="admin-panel">
        <div class="d-flex justify-content-between gap-3 align-items-center">
          <div>
            <h2 id="title">Content</h2>
            <p id="help" class="text-secondary"></p>
          </div>
          <button id="add" class="btn btn-primary">Add Record</button>
        </div>
        <div id="records" class="mt-3"></div>
      </section>
    </main>
    <div class="modal fade" id="editor">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="editorTitle" class="modal-title"></h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="friendlyForm" class="admin-form-grid"></form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel</button
            ><button id="save" class="btn btn-primary">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin.js"></script>
  </body>
</html>
